name: Verify Neon Architect

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile production modules
        run: python -m py_compile neon_architect.py neon_architect_v5.py generation_core.py
      - name: Offline smoke gate
        run: python smoke_test.py && pytest -m smoke -q
      - name: Full behavior suite
        run: pytest -q

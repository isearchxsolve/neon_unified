target-version = "py310"
extend-exclude = [
  ".git",
  ".pytest_cache",
  ".venv",
  ".venv-litellm",
  "_fleet_flutter_release_20260817",
  "_fleet_flutter_release_attempt2_20260817",
  "oiioii_clone_final",
  "oiioii_clone_final2",
  "oiioii_clone_final3",
